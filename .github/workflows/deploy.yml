name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          VITE_EVENTS_SHEET_CSV: ${{ vars.VITE_EVENTS_SHEET_CSV }}

      # GitHub Pages has no SPA rewrite rule, so a deep link like /events/foo
      # would 404 on refresh. Serving the app from 404.html as well means the
      # router still receives the original path and renders the right page.
      - run: cp dist/index.html dist/404.html

      # Stops Pages running the output through Jekyll.
      - run: touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
